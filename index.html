<script>
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");
    const message = document.getElementById("message");
    const author = document.getElementById("author");

    function moveNoButton() {
        const x = Math.random() * 260;
        const y = Math.random() * 90;
        noBtn.style.left = x + "px";
        noBtn.style.top = y + "px";
    }

    // 🔥 DÈS LE CHARGEMENT : mouvement continu et très rapide
    setInterval(moveNoButton, 120); // plus petit = plus rapide 😈

    noBtn.addEventListener("click", () => {
        message.textContent = "Toujours méchante envers moi 😔";
        author.textContent = "";
    });

    yesBtn.addEventListener("click", () => {
        message.textContent = "Tu es adorable princesse 💖";
        author.textContent = "— Saoud";
    });
</script>
