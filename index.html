<script>
    const noBtn = document.getElementById("no");
    const yesBtn = document.getElementById("yes");
    const message = document.getElementById("message");
    const author = document.getElementById("author");
    const container = document.querySelector(".buttons");

    function moveNoButton() {
        const maxX = container.clientWidth - noBtn.offsetWidth;
        const maxY = container.clientHeight - noBtn.offsetHeight;

        const x = Math.random() * maxX;
        const y = Math.random() * maxY;

        noBtn.style.left = x + "px";
        noBtn.style.top = y + "px";
    }

    // 🔥 Bouge automatiquement dès l'ouverture
    setInterval(moveNoButton, 80); // très rapide 😈

    // 📱 Fuit quand on essaie de le toucher
    noBtn.addEventListener("touchstart", moveNoButton);

    // 🖱️ Pour ordinateur
    noBtn.addEventListener("mouseover", moveNoButton);

    noBtn.addEventListener("click", () => {
        message.textContent = "Toujours méchante envers moi 😔";
        author.textContent = "";
    });

    yesBtn.addEventListener("click", () => {
        message.textContent = "Tu es adorable princesse 💖";
        author.textContent = "— Saoud";
    });
</script>
